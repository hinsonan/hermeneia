# Translation Models Configuration
# This file defines all available translation models for the Hermeneia application
# Models are organized by type: MADLAD (multilingual fallback) and MarianMT (specialized one-to-one)

# =============================================================================
# MADLAD-400 Multilingual Models (Universal Fallback)
# =============================================================================
# These models support 450+ languages but are larger in size
# Use as fallback when no specialized MarianMT model is available

[[madlad]]
name = "madlad-3b"
model_id = "jbochi/madlad400-3b-mt"
size_mb = 11800  # 11.8 GB
languages = 450
revision = "main"
description = "MADLAD-400 3B (11.8GB, 450+ languages)"

[[madlad]]
name = "madlad-7b"
model_id = "jbochi/madlad400-7b-mt"
size_mb = 20000  # ~20 GB estimated
languages = 450
revision = "main"
description = "MADLAD-400 7B (20GB, 450+ languages)"

[[madlad]]
name = "madlad-10b"
model_id = "jbochi/madlad400-10b-mt"
size_mb = 38000  # ~38 GB estimated
languages = 450
revision = "main"
description = "MADLAD-400 10B (38GB, 450+ languages)"

