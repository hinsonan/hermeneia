[package]
name = "hermeneia"
version = "2026.2.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "hermeneia"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hermeneia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Binary for testing audio trimming
[[bin]]
name = "audio-trim"
path = "src/bin/audio_trim.rs"

# Binary for generating test audio files
[[bin]]
name = "generate-test-audio"
path = "src/bin/generate_test_audio.rs"

# Binary for profiling trim operations
[[bin]]
name = "profile-trim"
path = "src/bin/profile_trim.rs"

# Binary for detailed profiling trim operations
[[bin]]
name = "profile-trim-detailed"
path = "src/bin/profile_trim_detailed.rs"

# Binary for detailed profiling compressed formats
[[bin]]
name = "profile-compressed-detailed"
path = "src/bin/profile_compressed_detailed.rs"

# Binary for transcription testing
[[bin]]
name = "transcribe"
path = "src/bin/transcribe/main.rs"

# Binary for translation testing
[[bin]]
name = "translate"
path = "src/bin/translate/main.rs"

# Binary for speaker diarization testing
[[bin]]
name = "speaker"
path = "src/bin/speaker/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }

# Audio dependencies
symphonia = { version = "0.5", features = [
    "all-codecs",  # All audio codecs (MP3, AAC, FLAC, etc.)
    "all-formats", # All container formats
] }
hound = "3.5"                                        # WAV I/O
rubato = "0.16"                                      # Resample
dasp = "0.11"                                        # Effects
cpal = "0.15"                                        # Playback
ringbuf = "0.4"                                      # Ring buffer for streaming playback

# ML/Whisper dependencies
# Note: MKL has compatibility issues with half-precision ops
# Using default CPU backend with optimized resampling instead
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
hf-hub = "0.4"
tokenizers = "0.21"
rust_tokenizers = "8.1"  # For MarianMT tokenizer support
rand = { version = "0.8", features = ["std_rng"] }
byteorder = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Speaker diarization via sherpa-onnx ONNX runtime
# download-binaries is enabled via the default "sherpa-download" feature (disabled for cuda builds)
sherpa-rs = { version = "0.6.8", default-features = false }

# custom
thiserror = "1"
anyhow = "1"
dirs = "5"
indicatif = "0.17"

# System info & capability detection
sysinfo = "0.32"
once_cell = "1.19"
nvml-wrapper = { version = "0.10", optional = true }

[features]
# sherpa-download: auto-download pre-built sherpa-onnx binaries (cannot combine with cuda)
# Disabled for CUDA builds via --no-default-features so sherpa-rs builds from source instead
default = ["sherpa-download"]
sherpa-download = ["sherpa-rs/download-binaries"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "nvml-wrapper", "sherpa-rs/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

# Optimized release profile for CPU inference performance
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release.build-override]
opt-level = 3
