services:
  # Extract CUDA 12.8 + cuDNN 9 runtime libraries for local development.
  # ORT 1.23.2-patched (used by sherpa-onnx) requires CUDA 12.x and cuDNN 9.
  # cuDNN 9 is installed from the NVIDIA apt repo inside the container.
  # Run once: docker-compose -f docker-compose.cuda.yml run --rm extract-cuda-libs
  extract-cuda-libs:
    image: nvidia/cuda:12.8.0-devel-ubuntu22.04
    volumes:
      - ./cuda-libs:/output
    command: |
      sh -c "
        apt-get update -qq && apt-get install -y libcudnn9-cuda-12 2>/dev/null || true &&
        mkdir -p /output &&
        cp -P /usr/local/cuda/lib64/libcudart.so* /output/ &&
        cp -P /usr/local/cuda/lib64/libcublas.so* /output/ &&
        cp -P /usr/local/cuda/lib64/libcublasLt.so* /output/ &&
        cp -P /usr/local/cuda/lib64/libnvrtc.so* /output/ &&
        cp -P /usr/local/cuda/lib64/libcurand.so* /output/ &&
        cp -P /usr/local/cuda/lib64/libcufft.so* /output/ 2>/dev/null || true &&
        cp -P /usr/lib/x86_64-linux-gnu/libcudnn*.so* /output/ 2>/dev/null || true &&
        echo '' &&
        echo '✅ CUDA 12.8 + cuDNN 9 libs extracted to cuda-libs/' &&
        ls -lh /output/
      "

  # Build Tauri app with CUDA for development
  # Usage: docker-compose -f docker-compose.cuda.yml run --rm build-dev
  build-dev:
    build:
      context: .
      dockerfile: Dockerfile.cuda-static
      target: base
    image: hermeneia-cuda-base:12.8
    volumes:
      # Mount source for incremental builds
      - ./src:/build/src
      - ./Cargo.toml:/build/Cargo.toml
      - ./Cargo.lock:/build/Cargo.lock
      - ./build.rs:/build/build.rs
      - ./tauri.conf.json:/build/tauri.conf.json
      - ./capabilities:/build/capabilities
      - ./icons:/build/icons
      - ./gen:/build/gen
      - ./assets:/build/assets
      # Output compiled binary to host (sherpa-onnx .so files also land here at debug/)
      - ./target-cuda:/build/target
      # Cargo cache for faster rebuilds
      - cargo-cache:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    command: |
      sh -c "
        echo '🔨 Building Tauri app with CUDA...' &&
        echo '' &&
        echo '🧹 Removing stale ORT libs so CUDA 12 versions are copied fresh...' &&
        rm -f /build/target/debug/libonnxruntime*.so* /build/target/debug/deps/libonnxruntime*.so* &&
        rm -rf /build/target/debug/.fingerprint/sherpa-rs-sys-* &&
        cargo build --no-default-features --features cuda &&
        echo '📚 Copying ORT provider shared libs (dlopen deps not handled by build script)...' &&
        cp -L $${SHERPA_LIB_PATH}/lib/libonnxruntime*.so* /build/target/debug/ &&
        echo '' &&
        echo '✅ Build complete!' &&
        echo '📦 Binary: ./target-cuda/debug/hermeneia' &&
        echo '' &&
        echo '🚀 To run: npm run dev:cuda' &&
        echo '' &&
        echo '🔧 Fixing file ownership...' &&
        chown -R \$$HOST_UID:\$$HOST_GID /build/target 2>/dev/null || true
      "

  # Bundle Tauri app with CUDA as .deb, .rpm, .AppImage
  # Usage: docker-compose -f docker-compose.cuda.yml run --rm bundle-cuda
  bundle-cuda:
    build:
      context: .
      dockerfile: Dockerfile.cuda-static
      target: bundler
    image: hermeneia-cuda-bundler:12.8
    volumes:
      # Mount full project (one level up from src-tauri)
      - ..:/project
      # Separate target dir so CUDA builds don't conflict with CPU builds
      - cuda-bundle-target:/project/src-tauri/target
      # Output bundles to host
      - ./cuda-bundles:/cuda-bundles
      # Cargo cache for faster rebuilds
      - cargo-cache:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
    working_dir: /project
    environment:
      - NO_STRIP=true
      # linuxdeploy can't use FUSE inside Docker, extract instead
      - APPIMAGE_EXTRACT_AND_RUN=1
      # Set RPATH so binary finds CUDA libs relative to itself:
      #   ../lib/hermeneia/ for .deb/.rpm (binary at /usr/bin/, libs at /usr/lib/hermeneia/)
      #   ../lib/ for .AppImage (binary at usr/bin/, libs at usr/lib/)
      - RUSTFLAGS=-C link-args=-Wl,-rpath,$$ORIGIN/../lib/hermeneia:$$ORIGIN/../lib
      # Host user's UID/GID so we can fix file ownership after build
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    command: |
      sh -c "
        echo '📦 Building CUDA bundles (.deb, .rpm, .AppImage)...' &&
        echo '🔗 Creating libcuda.so.1 stub for linuxdeploy...' &&
        ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/lib/x86_64-linux-gnu/libcuda.so.1 &&
        npm ci &&
        echo '📚 Copying ORT dlopen provider libs to cuda-libs for bundling...' &&
        cp -L $${SHERPA_LIB_PATH}/lib/libonnxruntime_providers_shared.so /project/src-tauri/cuda-libs/ &&
        cp -L $${SHERPA_LIB_PATH}/lib/libonnxruntime_providers_cuda.so /project/src-tauri/cuda-libs/ &&
        export LD_LIBRARY_PATH=/project/src-tauri/cuda-libs:/project/src-tauri/target/release:$$LD_LIBRARY_PATH &&
        npx tauri build --config src-tauri/tauri.cuda.conf.json --bundles deb,rpm,appimage -- --no-default-features --features cuda &&
        echo '' &&
        sh /project/scripts/fix-appimage-cuda.sh &&
        echo '' &&
        echo '✅ Bundle complete! Copying to cuda-bundles/...' &&
        rm -rf /cuda-bundles/* &&
        cp -r /project/src-tauri/target/release/bundle/* /cuda-bundles/ &&
        echo '' &&
        echo '📦 Output:' &&
        ls -lhR /cuda-bundles/ &&
        echo '' &&
        echo '🔧 Fixing file ownership...' &&
        chown -R \$$HOST_UID:\$$HOST_GID /project/node_modules /project/src-tauri/dist /cuda-bundles 2>/dev/null || true
      "

volumes:
  cargo-cache:
  cargo-git:
  cuda-bundle-target:
