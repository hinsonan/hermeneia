name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_target:
        description: 'What to build'
        type: choice
        default: 'all'
        options:
          - all
          - cuda-both
          - cuda-linux
          - cuda-windows
      use_sccache:
        description: 'Use sccache to speed up Rust compilation'
        type: boolean
        default: true
      build_metal:
        description: 'Build Metal variant'
        type: boolean
        default: true
      create_release:
        description: 'Create a GitHub Release (requires build_target=all)'
        type: boolean
        default: false
      release_visibility:
        description: 'Release visibility when creating a release'
        type: choice
        default: 'prerelease'
        options:
          - prerelease
          - draft
      release_tag:
        description: 'Release tag (e.g. v0.1.0)'
        type: string
        default: 'v0.0.0-test'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'

defaults:
  run:
    working-directory: hermeneia

jobs:
  # ===========================================================================
  # Job 1: Linux CPU
  # ===========================================================================
  linux-cpu:
    runs-on: ubuntu-22.04
    if: inputs.build_target == 'all' || inputs.build_target == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermeneia/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermeneia/src-tauri

      - name: Set up sccache
        if: inputs.use_sccache != false
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf libarchive-tools

      - name: Reset sherpa-rs build metadata
        run: |
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-rs-sys
          rm -rf ~/.cache/sherpa-rs

      - name: Download pre-built sherpa-onnx runtime (Linux CPU)
        env:
          SHERPA_ONNX_VERSION: '1.12.9'
          SHERPA_ONNX_SHA256: 'cd22ee337e205674536643d2bc86e984fbbbf9c5c52743c4df6fc8d8dd17371b'
        run: |
          set -euo pipefail
          archive_name="sherpa-onnx-v${SHERPA_ONNX_VERSION}-linux-x64-shared.tar.bz2"
          url="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/${archive_name}"
          runtime_root=".sherpa-runtime/linux-x64"

          curl -L --retry 5 --retry-delay 2 --retry-all-errors -o "$archive_name" "$url"
          echo "${SHERPA_ONNX_SHA256}  ${archive_name}" | sha256sum -c -

          rm -rf "$runtime_root"
          mkdir -p "$runtime_root"
          tar -xjf "$archive_name" -C "$runtime_root"
          rm -f "$archive_name"

          extracted_dir="$runtime_root/sherpa-onnx-v${SHERPA_ONNX_VERSION}-linux-x64-shared"
          test -f "$extracted_dir/lib/libonnxruntime.so"
          test -f "$extracted_dir/lib/libsherpa-onnx-c-api.so"

          echo "SHERPA_LIB_PATH=${GITHUB_WORKSPACE}/hermeneia/${extracted_dir}" >> "$GITHUB_ENV"

      - name: Stage sherpa runtime libs for Linux bundles
        run: |
          set -euo pipefail
          mkdir -p src-tauri/sherpa-libs
          cp -fL "$SHERPA_LIB_PATH/lib/libsherpa-onnx-c-api.so" src-tauri/sherpa-libs/
          cp -fL "$SHERPA_LIB_PATH/lib/libsherpa-onnx-cxx-api.so" src-tauri/sherpa-libs/
          cp -fL "$SHERPA_LIB_PATH/lib/libonnxruntime.so" src-tauri/sherpa-libs/
          test -f src-tauri/sherpa-libs/libsherpa-onnx-c-api.so
          test -f src-tauri/sherpa-libs/libsherpa-onnx-cxx-api.so
          test -f src-tauri/sherpa-libs/libonnxruntime.so
          ls -l src-tauri/sherpa-libs

      - run: npm ci

      - name: Build Tauri (CPU)
        run: |
          RUSTFLAGS="-C link-args=-Wl,-rpath,\$ORIGIN/../lib/hermeneia:\$ORIGIN/../lib" \
          LD_LIBRARY_PATH="$SHERPA_LIB_PATH/lib:$LD_LIBRARY_PATH" \
          npm run build:cpu -- --config src-tauri/tauri.runtime-libs.conf.json --verbose --bundles deb,rpm,appimage -- --no-default-features

      - name: Verify sherpa libs in deb/rpm payloads
        run: |
          set -euo pipefail

          deb_files=(src-tauri/target/release/bundle/deb/*.deb)
          rpm_files=(src-tauri/target/release/bundle/rpm/*.rpm)
          test -e "${deb_files[0]}"
          test -e "${rpm_files[0]}"

          deb_file="${deb_files[0]}"
          rpm_file="${rpm_files[0]}"

          tmpdir="$(mktemp -d)"
          bsdtar -xf "$deb_file" -C "$tmpdir"
          deb_listing="$(bsdtar -tf "$tmpdir/data.tar.gz")"
          rpm_listing="$(bsdtar -tf "$rpm_file")"

          for lib in libsherpa-onnx-c-api.so libsherpa-onnx-cxx-api.so libonnxruntime.so; do
            printf '%s\n' "$deb_listing" | grep -qx "usr/lib/hermeneia/$lib"
            printf '%s\n' "$rpm_listing" | grep -qx "./usr/lib/hermeneia/$lib"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-cpu
          path: |
            hermeneia/src-tauri/target/release/bundle/deb/*.deb
            hermeneia/src-tauri/target/release/bundle/rpm/*.rpm
            hermeneia/src-tauri/target/release/bundle/appimage/*.AppImage
          compression-level: 1

  # ===========================================================================
  # Job 2: Linux CUDA (Docker-based)
  # ===========================================================================
  linux-cuda:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build_target == 'all' || inputs.build_target == 'cuda-both' || inputs.build_target == 'cuda-linux'
    steps:
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/Java* \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/node \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/google-cloud-sdk \
            /usr/lib/jvm \
            /usr/lib/mono \
            /usr/lib/heroku
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-cuda-${{ hashFiles('hermeneia/src-tauri/Dockerfile.cuda-static') }}
          restore-keys: docker-cuda-

      - name: Cache Cargo registry (for Docker)
        uses: actions/cache@v4
        with:
          path: ~/.cargo-docker-cache
          key: cargo-docker-${{ hashFiles('hermeneia/src-tauri/Cargo.lock') }}
          restore-keys: cargo-docker-

      - name: Build Docker image
        working-directory: hermeneia/src-tauri
        run: |
          docker buildx build \
            --file Dockerfile.cuda-static \
            --target bundler \
            --tag hermeneia-cuda-bundler:12.8 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load .
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Build CUDA bundles in Docker
        run: |
          mkdir -p ~/.cargo-docker-cache/registry ~/.cargo-docker-cache/git
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -v "$HOME/.cargo-docker-cache/registry:/root/.cargo/registry" \
            -v "$HOME/.cargo-docker-cache/git:/root/.cargo/git" \
            -w /project/hermeneia \
            -e NO_STRIP=true \
            -e APPIMAGE_EXTRACT_AND_RUN=1 \
            -e "RUSTFLAGS=-C link-args=-Wl,-rpath,\$ORIGIN/../lib/hermeneia:\$ORIGIN/../lib" \
            hermeneia-cuda-bundler:12.8 \
            sh -c '
              ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/lib/x86_64-linux-gnu/libcuda.so.1 &&
              mkdir -p src-tauri/cuda-libs &&
              cp /build/lib/libcudart.so.12 src-tauri/cuda-libs/ &&
              cp /build/lib/libcublas.so.12 src-tauri/cuda-libs/ &&
              cp /build/lib/libcublasLt.so.12 src-tauri/cuda-libs/ &&
              cp /build/lib/libnvrtc.so.12 src-tauri/cuda-libs/ &&
              cp /build/lib/libcurand.so.10 src-tauri/cuda-libs/ &&
              cp -L /build/lib/libcudnn*.so.9* src-tauri/cuda-libs/ &&
              cp -L ${SHERPA_LIB_PATH}/lib/libonnxruntime_providers_shared.so src-tauri/cuda-libs/ &&
              cp -L ${SHERPA_LIB_PATH}/lib/libonnxruntime_providers_cuda.so src-tauri/cuda-libs/ &&
              npm ci &&
              export LD_LIBRARY_PATH=$(pwd)/src-tauri/cuda-libs:$(pwd)/src-tauri/target/release:$LD_LIBRARY_PATH &&
              npx tauri build --config src-tauri/tauri.cuda.conf.json --bundles deb,rpm,appimage -- --no-default-features --features cuda &&
              sh /project/hermeneia/scripts/fix-appimage-cuda.sh /project/hermeneia/src-tauri/target/release/bundle/appimage
            '

      - name: Rename CUDA artifacts
        run: |
          sudo chown -R $(id -u):$(id -g) src-tauri/target/release/bundle
          cd src-tauri/target/release/bundle
          # Rename deb
          for f in deb/*.deb; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .deb)
            mv "$f" "deb/${base}-cuda.deb"
          done
          # Rename rpm
          for f in rpm/*.rpm; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .rpm)
            mv "$f" "rpm/${base}-cuda.rpm"
          done
          # Rename appimage
          for f in appimage/*.AppImage; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .AppImage)
            mv "$f" "appimage/${base}-cuda.AppImage"
          done

      - name: Prepare CUDA distribution assets
        run: |
          mkdir -p release-cuda-assets

          prepare_asset() {
            f="$1"
            [ -f "$f" ] || return 0

            size=$(stat -c%s "$f")
            base=$(basename "$f")

            if [ "$size" -lt 2147483648 ]; then
              cp "$f" "release-cuda-assets/$base"
              return 0
            fi

            echo "Asset exceeds GitHub Release size limit; compressing: $base"
            xz -T0 -9 -c "$f" > "release-cuda-assets/${base}.xz"

            compressed_size=$(stat -c%s "release-cuda-assets/${base}.xz")
            if [ "$compressed_size" -ge 2147483648 ]; then
              echo "Compressed asset still exceeds limit; splitting: ${base}.xz"
              split -b 1900m -d -a 3 "release-cuda-assets/${base}.xz" "release-cuda-assets/${base}.xz.part-"
              rm -f "release-cuda-assets/${base}.xz"
            fi
          }

          for f in src-tauri/target/release/bundle/deb/*-cuda.deb; do
            prepare_asset "$f"
          done

          for f in src-tauri/target/release/bundle/rpm/*-cuda.rpm; do
            prepare_asset "$f"
          done

          for f in src-tauri/target/release/bundle/appimage/*-cuda.AppImage; do
            prepare_asset "$f"
          done

          ls -lh release-cuda-assets

      # Attach directly to Release (bypasses 500MB artifact limit)
      - name: Attach CUDA artifacts to Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: ${{ inputs.release_visibility == 'draft' }}
          prerelease: ${{ inputs.release_visibility != 'draft' }}
          body_path: .github/RELEASE_NOTES_HEADER.md
          fail_on_unmatched_files: true
          files: hermeneia/release-cuda-assets/*

      # No release: upload as artifact for inspection
      - name: Upload CUDA artifacts
        if: "!startsWith(github.ref, 'refs/tags/v') && inputs.create_release != true"
        uses: actions/upload-artifact@v4
        with:
          name: linux-cuda
          path: hermeneia/release-cuda-assets/*
          compression-level: 1

  # ===========================================================================
  # Job 3: Windows CPU
  # ===========================================================================
  windows-cpu:
    runs-on: windows-latest
    if: inputs.build_target == 'all' || inputs.build_target == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermeneia/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermeneia/src-tauri

      - name: Set up sccache
        if: inputs.use_sccache != false
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Reset sherpa-rs build metadata
        shell: pwsh
        run: |
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-rs-sys
          Remove-Item "$env:LOCALAPPDATA\sherpa-rs" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Download pre-built sherpa-onnx runtime (Windows CPU)
        shell: pwsh
        env:
          SHERPA_ONNX_VERSION: '1.12.9'
          SHERPA_ONNX_SHA256: '57a0dff63c468ed067c6ffd1a9c9b6f66f4cf73304d44b5f17518010ce2e0977'
        run: |
          $archiveName = "sherpa-onnx-v$env:SHERPA_ONNX_VERSION-win-x64-shared.tar.bz2"
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$env:SHERPA_ONNX_VERSION/$archiveName"
          $runtimeRoot = ".sherpa-runtime\win-x64"

          Invoke-WebRequest -Uri $url -OutFile $archiveName
          $actualSha256 = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSha256 = $env:SHERPA_ONNX_SHA256.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "SHA256 mismatch for $archiveName. Expected $expectedSha256 but got $actualSha256"
          }

          Remove-Item $runtimeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runtimeRoot | Out-Null
          tar -xjf $archiveName -C $runtimeRoot
          Remove-Item $archiveName -Force

          $extractedDir = Join-Path $runtimeRoot "sherpa-onnx-v$env:SHERPA_ONNX_VERSION-win-x64-shared"
          $requiredLibs = @(
            (Join-Path $extractedDir "lib\sherpa-onnx-c-api.lib"),
            (Join-Path $extractedDir "lib\cargs.lib"),
            (Join-Path $extractedDir "lib\onnxruntime.dll"),
            (Join-Path $extractedDir "lib\sherpa-onnx-c-api.dll")
          )
          foreach ($required in $requiredLibs) {
            if (-not (Test-Path $required)) {
              throw "Missing required sherpa import library: $required"
            }
          }

          $resolvedSherpaPath = (Resolve-Path $extractedDir).Path
          echo "SHERPA_LIB_PATH=$resolvedSherpaPath" >> $env:GITHUB_ENV

      - run: npm ci

      - name: Stage Sherpa runtime DLLs for CPU bundle
        shell: pwsh
        run: |
          if (-not $env:SHERPA_LIB_PATH) {
            throw "SHERPA_LIB_PATH is not set"
          }

          $cpuDllDir = "src-tauri\cpu-libs"
          New-Item -ItemType Directory -Force -Path $cpuDllDir | Out-Null

          $sherpaLibDir = Join-Path $env:SHERPA_LIB_PATH "lib"
          $sherpaBinDir = Join-Path $env:SHERPA_LIB_PATH "bin"

          if (Test-Path $sherpaBinDir) {
            $binDlls = @(Get-ChildItem (Join-Path $sherpaBinDir "*.dll") -File -ErrorAction Stop)
            if ($binDlls.Count -gt 0) {
              $binDlls | Copy-Item -Destination $cpuDllDir -Force -ErrorAction Stop
            }
            else {
              Write-Warning "No DLL files found in $sherpaBinDir"
            }
          }
          if (Test-Path $sherpaLibDir) {
            $libDlls = @(Get-ChildItem (Join-Path $sherpaLibDir "*.dll") -File -ErrorAction Stop)
            if ($libDlls.Count -gt 0) {
              $libDlls | Copy-Item -Destination $cpuDllDir -Force -ErrorAction Stop
            }
            else {
              Write-Warning "No DLL files found in $sherpaLibDir"
            }
          }

          $requiredCpuDlls = @(
            "sherpa-onnx-c-api.dll",
            "onnxruntime.dll"
          )
          foreach ($dll in $requiredCpuDlls) {
            if (-not (Test-Path (Join-Path $cpuDllDir $dll))) {
              throw "Missing required CPU runtime DLL in ${cpuDllDir}: $dll"
            }
          }

      - name: Build Tauri (CPU)
        run: npx tauri build --config src-tauri/tauri.cpu.windows.conf.json --bundles nsis -- --no-default-features

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cpu
          path: hermeneia/src-tauri/target/release/bundle/nsis/*.exe
          compression-level: 1

  # ===========================================================================
  # Job 4: Windows CUDA
  # ===========================================================================
  windows-cuda:
    runs-on: windows-latest
    timeout-minutes: 120
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build_target == 'all' || inputs.build_target == 'cuda-both' || inputs.build_target == 'cuda-windows'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermeneia/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermeneia/src-tauri

      - name: Set up sccache
        if: inputs.use_sccache != false
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Reset sherpa-rs build metadata
        shell: pwsh
        run: |
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-rs-sys
          Remove-Item "$env:LOCALAPPDATA\sherpa-rs" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '12.8.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "nvrtc", "nvrtc_dev", "curand", "curand_dev", "cufft", "cufft_dev", "visual_studio_integration"]'

      - name: Download pre-built sherpa-onnx with CUDA 12.x + cuDNN 9.x
        shell: pwsh
        env:
          SHERPA_ONNX_VERSION: '1.12.28'
          SHERPA_ONNX_SHA256: 'db77faa78e6e326239354563c21eb84a57f22f0f72ebb3be5d61086232afcb8b'
        run: |
          $archiveName = "sherpa-onnx-v$env:SHERPA_ONNX_VERSION-cuda-12.x-cudnn-9.x-win-x64-cuda.tar.bz2"
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$env:SHERPA_ONNX_VERSION/$archiveName"
          Write-Host "Downloading $url ..."
          Invoke-WebRequest -Uri $url -OutFile $archiveName
          $actualSha256 = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSha256 = $env:SHERPA_ONNX_SHA256.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "SHA256 mismatch for $archiveName. Expected $expectedSha256 but got $actualSha256"
          }
          Write-Host "SHA256 verified: $actualSha256"
          Write-Host "Extracting..."
          tar -xjf $archiveName
          Remove-Item $archiveName
          $extractedDir = "sherpa-onnx-v$env:SHERPA_ONNX_VERSION-cuda-12.x-cudnn-9.x-win-x64-cuda"
          Write-Host "Sherpa libs at: $extractedDir"
          Get-ChildItem "$extractedDir/lib/" | Select-Object Name, Length
          # Set SHERPA_LIB_PATH so sherpa-rs-sys uses pre-built libs (skips cmake)
          echo "SHERPA_LIB_PATH=${{ github.workspace }}/hermeneia/$extractedDir" >> $env:GITHUB_ENV

      - name: Download cuDNN runtime from NVIDIA PyPI
        shell: pwsh
        env:
          CUDNN_PYPI_VERSION: '9.19.0.56'
          CUDNN_PYPI_SHA256: 'cec70596b9ce878fab83810c3f5a2e606d35f510e5fee579759e4cbc68a23750'
        run: |
          $wheelDir = Join-Path $PWD ".python-wheels"
          $extractDir = Join-Path $PWD ".python-runtime"
          New-Item -ItemType Directory -Force -Path $wheelDir | Out-Null
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          python -m pip download --only-binary=:all: --no-deps --dest $wheelDir "nvidia-cudnn-cu12==$env:CUDNN_PYPI_VERSION"

          $wheel = Get-ChildItem $wheelDir "nvidia_cudnn_cu12-$env:CUDNN_PYPI_VERSION-*-win_amd64.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "Failed to download cuDNN wheel for version $env:CUDNN_PYPI_VERSION"
          }

          $actualSha256 = (Get-FileHash -Path $wheel.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSha256 = $env:CUDNN_PYPI_SHA256.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "SHA256 mismatch for $($wheel.Name). Expected $expectedSha256 but got $actualSha256"
          }

          python -m pip install --no-deps --target $extractDir $wheel.FullName

          $cudnnDllDir = Join-Path $extractDir "nvidia\cudnn\bin"
          if (-not (Test-Path $cudnnDllDir)) {
            throw "cuDNN DLL directory not found after wheel install: $cudnnDllDir"
          }

          Write-Host "cuDNN DLL directory contents:"
          Get-ChildItem $cudnnDllDir | Select-Object Name, Length

          echo "CUDNN_DLL_DIR=$cudnnDllDir" >> $env:GITHUB_ENV

      - name: Collect CUDA runtime DLLs for portable package
        shell: pwsh
        run: |
          $bundleDllDir = "src-tauri\cuda-libs"
          New-Item -ItemType Directory -Force -Path $bundleDllDir | Out-Null
          if (-not $env:SHERPA_LIB_PATH) {
            throw "SHERPA_LIB_PATH is not set"
          }
          if (-not $env:CUDNN_DLL_DIR) {
            throw "CUDNN_DLL_DIR is not set"
          }
          $sherpaLibDir = Join-Path $env:SHERPA_LIB_PATH "lib"
          $sherpaBinDir = Join-Path $env:SHERPA_LIB_PATH "bin"
          $cudnnDllDir = $env:CUDNN_DLL_DIR
          if (-not (Test-Path $sherpaLibDir) -and -not (Test-Path $sherpaBinDir)) {
            throw "Sherpa runtime directories do not exist: $sherpaBinDir or $sherpaLibDir"
          }
          if (-not (Test-Path $cudnnDllDir)) {
            throw "cuDNN DLL directory does not exist: $cudnnDllDir"
          }

          if (Test-Path $sherpaBinDir) {
            Write-Host "Sherpa bin directory contents:"
            Get-ChildItem $sherpaBinDir | Select-Object Name, Length
          }
          if (Test-Path $sherpaLibDir) {
            Write-Host "Sherpa lib directory contents:"
            Get-ChildItem $sherpaLibDir | Select-Object Name, Length
          }
          Write-Host "cuDNN DLL directory contents:"
          Get-ChildItem $cudnnDllDir | Select-Object Name, Length

          # Copy all sherpa runtime DLLs (both bin and lib)
          if (Test-Path $sherpaBinDir) {
            Copy-Item (Join-Path $sherpaBinDir "*.dll") $bundleDllDir -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path $sherpaLibDir) {
            Copy-Item (Join-Path $sherpaLibDir "*.dll") $bundleDllDir -Force -ErrorAction SilentlyContinue
          }

          # CUDA runtime DLLs from toolkit
          $cudaPatterns = @(
            "cudart64_*.dll",
            "cublas64_*.dll",
            "cublasLt64_*.dll",
            "nvrtc64_*.dll",
            "curand64_*.dll",
            "cufft64_*.dll"
          )
          foreach ($pattern in $cudaPatterns) {
            $matches = @(Get-ChildItem (Join-Path "$env:CUDA_PATH\bin" $pattern) -File -ErrorAction SilentlyContinue)
            if ($matches.Count -eq 0) {
              throw "Missing required CUDA toolkit DLL(s): $pattern under $env:CUDA_PATH\bin"
            }
            $matches | Copy-Item -Destination $bundleDllDir -Force
          }

          # cuDNN DLLs (dlopen'd by ORT CUDA provider)
          $cudnnDlls = @(Get-ChildItem (Join-Path $cudnnDllDir "cudnn*.dll") -File -ErrorAction SilentlyContinue)
          if ($cudnnDlls.Count -eq 0) {
            $cudnnDlls = @()
            if (Test-Path $sherpaBinDir) {
              $cudnnDlls += @(Get-ChildItem (Join-Path $sherpaBinDir "cudnn*.dll") -File -ErrorAction SilentlyContinue)
            }
            if (Test-Path $sherpaLibDir) {
              $cudnnDlls += @(Get-ChildItem (Join-Path $sherpaLibDir "cudnn*.dll") -File -ErrorAction SilentlyContinue)
            }
          }
          if ($cudnnDlls.Count -eq 0) {
            throw "No cuDNN DLLs found in $cudnnDllDir, $sherpaBinDir, or $sherpaLibDir"
          }
          $cudnnDlls | Copy-Item -Destination $bundleDllDir -Force

          # Required runtime DLL gate
          $requiredExactDlls = @(
            "sherpa-onnx-c-api.dll",
            "onnxruntime.dll",
            "onnxruntime_providers_shared.dll",
            "onnxruntime_providers_cuda.dll"
          )
          foreach ($dll in $requiredExactDlls) {
            if (-not (Test-Path (Join-Path $bundleDllDir $dll))) {
              throw "Missing required runtime DLL in ${bundleDllDir}: $dll"
            }
          }

          $requiredPatternDlls = @(
            "cudart64_*.dll",
            "cublas64_*.dll",
            "cublasLt64_*.dll",
            "curand64_*.dll",
            "cufft64_*.dll",
            "cudnn*.dll"
          )
          foreach ($pattern in $requiredPatternDlls) {
            $matches = @(Get-ChildItem (Join-Path $bundleDllDir $pattern) -File -ErrorAction SilentlyContinue)
            if ($matches.Count -eq 0) {
              throw "Missing required runtime DLL pattern in ${bundleDllDir}: $pattern"
            }
          }

          Write-Host "Bundled DLLs in ${bundleDllDir}:"
          Get-ChildItem $bundleDllDir | Sort-Object Name | Select-Object Name, Length

      - uses: ilammy/msvc-dev-cmd@v1

      - run: npm ci

      - name: Build Tauri (CUDA)
        env:
          CUDA_COMPUTE_CAP: '75'
        run: npx tauri build --no-bundle --config src-tauri/tauri.cuda.windows.conf.json -- --no-default-features --features cuda

      - name: Validate runtime imports with dumpbin
        shell: pwsh
        run: |
          if (-not (Get-Command dumpbin -ErrorAction SilentlyContinue)) {
            throw "dumpbin was not found in PATH"
          }

          $exePath = "src-tauri\target\release\hermeneia.exe"
          $providerPath = "src-tauri\cuda-libs\onnxruntime_providers_cuda.dll"
          $bundleDllDir = "src-tauri\cuda-libs"

          if (-not (Test-Path $exePath)) {
            throw "Missing executable: $exePath"
          }
          if (-not (Test-Path $providerPath)) {
            throw "Missing provider DLL: $providerPath"
          }

          $exeDependents = & dumpbin /dependents $exePath
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed for $exePath"
          }

          $providerDependents = & dumpbin /dependents $providerPath
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed for $providerPath"
          }

          if (-not ($exeDependents -match '(?i)sherpa-onnx-c-api\.dll')) {
            throw "Expected sherpa-onnx-c-api.dll import not found in hermeneia.exe"
          }

          $requiredProviderImports = @(
            '(?i)onnxruntime_providers_shared\.dll',
            '(?i)cudart64_.*\.dll',
            '(?i)cublas64_.*\.dll',
            '(?i)cublaslt64_.*\.dll',
            '(?i)cufft64_.*\.dll',
            '(?i)cudnn64_.*\.dll'
          )
          foreach ($importPattern in $requiredProviderImports) {
            if (-not ($providerDependents -match $importPattern)) {
              throw "Expected import missing from onnxruntime_providers_cuda.dll: $importPattern"
            }
          }

          $requiredStagedPatterns = @(
            "sherpa-onnx-c-api.dll",
            "onnxruntime.dll",
            "onnxruntime_providers_shared.dll",
            "onnxruntime_providers_cuda.dll",
            "cudart64_*.dll",
            "cublas64_*.dll",
            "cublasLt64_*.dll",
            "curand64_*.dll",
            "cufft64_*.dll",
            "cudnn*.dll"
          )
          foreach ($pattern in $requiredStagedPatterns) {
            $matches = @(Get-ChildItem (Join-Path $bundleDllDir $pattern) -File -ErrorAction SilentlyContinue)
            if ($matches.Count -eq 0) {
              throw "Missing staged runtime dependency in ${bundleDllDir}: $pattern"
            }
          }

          Write-Host "Dependency smoke check passed for $exePath and $providerPath"

      - name: Package CUDA portable archive
        shell: pwsh
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $bundleDir = "src-tauri\target\release\bundle\portable"
          $stagingDir = Join-Path $bundleDir "hermeneia-cuda"
          $assetPrefix = "hermeneia_${version}_windows_x64_cuda_portable"
          $archiveBase = "$assetPrefix.7z"
          $checksumPath = Join-Path $bundleDir "$assetPrefix.sha256"

          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            throw "7z is required to package the Windows CUDA portable build"
          }

          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          Remove-Item $stagingDir -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem (Join-Path $bundleDir "$assetPrefix.7z*") -ErrorAction SilentlyContinue | Remove-Item -Force
          Remove-Item $checksumPath -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          Copy-Item "src-tauri\target\release\hermeneia.exe" $stagingDir
          Copy-Item "src-tauri\cuda-libs\*.dll" $stagingDir -Force

          @"
          Hermeneia CUDA portable build

          Contents:
          - hermeneia.exe
          - Required CUDA, ONNX Runtime, and cuDNN DLLs

          Notes:
          - Requires Microsoft Edge WebView2 Runtime on the target machine.
          - If split into parts, keep all .7z.00N files in the same folder and extract from .7z.001.
          "@ | Set-Content -Path (Join-Path $stagingDir "README.txt")

          $rawSize = (Get-ChildItem $stagingDir -Recurse -File | Measure-Object Length -Sum).Sum

          Push-Location $bundleDir
          if ($rawSize -ge 1900MB) {
            & 7z a -t7z -mx=1 -v1900m $archiveBase "hermeneia-cuda\*"
          }
          else {
            & 7z a -t7z -mx=1 $archiveBase "hermeneia-cuda\*"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "7z packaging failed with exit code $LASTEXITCODE"
          }
          Pop-Location

          $archiveOutputs = @(Get-ChildItem (Join-Path $bundleDir "$archiveBase*") -File | Sort-Object Name)
          if ($archiveOutputs.Count -eq 0) {
            throw "No archive outputs found for $archiveBase"
          }

          $archiveForTest = $archiveOutputs | Where-Object { $_.Name -eq $archiveBase } | Select-Object -First 1
          if (-not $archiveForTest) {
            $archiveForTest = $archiveOutputs | Where-Object { $_.Name -eq "$archiveBase.001" } | Select-Object -First 1
          }
          if (-not $archiveForTest) {
            throw "Unable to determine archive file for integrity test"
          }

          & 7z t $archiveForTest.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "7z integrity test failed for $($archiveForTest.Name)"
          }

          $checksumLines = @()
          foreach ($file in $archiveOutputs) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumLines += "$hash *$($file.Name)"
          }
          Set-Content -Path $checksumPath -Value $checksumLines

          Write-Host "Packaged CUDA archive parts:"
          Get-ChildItem (Join-Path $bundleDir "$assetPrefix.7z*") | Select-Object Name, Length
          Write-Host "Checksum file:"
          Get-Item $checksumPath | Select-Object Name, Length

      - name: Prepare bootstrap installer dependencies
        shell: pwsh
        run: |
          $packagingRoot = Join-Path $env:GITHUB_WORKSPACE "hermeneia\packaging\windows"
          $thirdPartyDir = Join-Path $packagingRoot "third_party\7z"
          New-Item -ItemType Directory -Force -Path $thirdPartyDir | Out-Null

          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y
          }

          $sevenZipExeCandidates = @(
            "$env:ProgramFiles\7-Zip\7z.exe",
            "${env:ProgramFiles(x86)}\7-Zip\7z.exe",
            (Get-Command 7z -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue)
          ) | Where-Object { $_ }

          $sevenZipExe = $null
          foreach ($candidate in $sevenZipExeCandidates) {
            if (Test-Path $candidate) {
              $sevenZipExe = $candidate
              break
            }
          }

          if (-not $sevenZipExe) {
            throw "Unable to locate 7z.exe after installing 7zip"
          }

          $sevenZipDir = Split-Path $sevenZipExe -Parent

          Copy-Item (Join-Path $sevenZipDir "7z.exe") (Join-Path $thirdPartyDir "7z.exe") -Force
          Copy-Item (Join-Path $sevenZipDir "7z.dll") (Join-Path $thirdPartyDir "7z.dll") -Force

          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
          }

      - name: Build Windows CUDA bootstrap installer
        shell: pwsh
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $tag = "${{ inputs.release_tag || github.ref_name }}"
          $repo = "${{ github.repository }}"
          $repoParts = $repo.Split("/")
          if ($repoParts.Count -ne 2) {
            throw "Unexpected github.repository format: $repo"
          }

          $repoOwner = $repoParts[0]
          $repoName = $repoParts[1]
          $assetPrefix = "hermeneia_${version}_windows_x64_cuda_portable"
          $outputDir = (Resolve-Path "src-tauri\target\release\bundle\portable").Path
          $nsiPath = Join-Path $env:GITHUB_WORKSPACE "hermeneia\packaging\windows\bootstrap-installer.nsi"
          if (-not (Test-Path $nsiPath)) {
            Write-Host "Expected NSIS script was not found at: $nsiPath"
            $packagingDir = Join-Path $env:GITHUB_WORKSPACE "hermeneia\packaging\windows"
            if (Test-Path $packagingDir) {
              Write-Host "Contents of ${packagingDir}:"
              Get-ChildItem $packagingDir -Recurse | Select-Object FullName
            }
            throw "Cannot continue without bootstrap-installer.nsi"
          }
          $makensisCandidates = @(
            "$env:ProgramFiles\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            (Get-Command makensis -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue)
          ) | Where-Object { $_ }

          $makensisExe = $null
          foreach ($candidate in $makensisCandidates) {
            if (Test-Path $candidate) {
              $makensisExe = $candidate
              break
            }
          }
          if (-not $makensisExe) {
            throw "Unable to locate makensis.exe after installing NSIS"
          }

          $makensisArgs = @(
            "/DOUTPUT_DIR=$outputDir",
            "/DAPP_VERSION=$version",
            "/DRELEASE_TAG=$tag",
            "/DREPO_OWNER=$repoOwner",
            "/DREPO_NAME=$repoName",
            "/DASSET_PREFIX=$assetPrefix",
            $nsiPath
          )
          & $makensisExe @makensisArgs

          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }

          $installerPath = Join-Path $outputDir "hermeneia_${version}_windows_x64_cuda_installer.exe"
          if (-not (Test-Path $installerPath)) {
            throw "Bootstrap installer was not created: $installerPath"
          }
          Get-Item $installerPath | Select-Object Name, Length

      - name: Remove stale Windows CUDA release assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.release_tag || github.ref_name }}"
          $assetNames = gh release view $tag --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag not found yet; skipping stale asset cleanup."
            exit 0
          }

          $patterns = @(
            '^hermeneia_.*_windows_x64_cuda_portable\.7z(\.\d+)?$',
            '^hermeneia_.*_windows_x64_cuda_portable\.sha256$',
            '^hermeneia_.*_windows_x64_cuda_installer\.exe$',
            '^hermeneia_.*_x64-cuda-portable\.7z(\.\d+)?$'
          )

          foreach ($name in $assetNames) {
            $shouldDelete = $false
            foreach ($pattern in $patterns) {
              if ($name -match $pattern) {
                $shouldDelete = $true
                break
              }
            }

            if ($shouldDelete) {
              Write-Host "Removing stale asset from release: $name"
              gh release delete-asset $tag $name --yes
            }
          }

      - name: Attach CUDA portable artifacts to Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: ${{ inputs.release_visibility == 'draft' }}
          prerelease: ${{ inputs.release_visibility != 'draft' }}
          body_path: .github/RELEASE_NOTES_HEADER.md
          fail_on_unmatched_files: true
          files: |
            hermeneia/src-tauri/target/release/bundle/portable/hermeneia_*_windows_x64_cuda_portable.7z*
            hermeneia/src-tauri/target/release/bundle/portable/hermeneia_*_windows_x64_cuda_portable.sha256

      - name: Attach CUDA bootstrap installer to Release
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true) && inputs.release_visibility != 'draft'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: ${{ inputs.release_visibility == 'draft' }}
          prerelease: ${{ inputs.release_visibility != 'draft' }}
          body_path: .github/RELEASE_NOTES_HEADER.md
          fail_on_unmatched_files: true
          files: |
            hermeneia/src-tauri/target/release/bundle/portable/hermeneia_*_windows_x64_cuda_installer.exe

      - name: Upload CUDA artifacts
        if: "!startsWith(github.ref, 'refs/tags/v') && inputs.create_release != true"
        uses: actions/upload-artifact@v4
        with:
          name: windows-cuda
          path: |
            hermeneia/src-tauri/target/release/bundle/portable/hermeneia_*_windows_x64_cuda_portable.7z*
            hermeneia/src-tauri/target/release/bundle/portable/hermeneia_*_windows_x64_cuda_portable.sha256
            hermeneia/src-tauri/target/release/bundle/portable/hermeneia_*_windows_x64_cuda_installer.exe
          compression-level: 1

  # ===========================================================================
  # Job 5: macOS Intel
  # ===========================================================================
  macos-intel:
    runs-on: macos-15-intel
    if: inputs.build_target == 'all' || inputs.build_target == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermeneia/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermeneia/src-tauri

      - name: Set up sccache
        if: inputs.use_sccache != false
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Reset sherpa-rs build metadata
        run: |
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-rs-sys
          rm -rf ~/Library/Caches/sherpa-rs

      - name: Download pre-built sherpa-onnx runtime (macOS Intel)
        env:
          SHERPA_ONNX_VERSION: '1.12.9'
          SHERPA_ONNX_SHA256: 'e3f3596b84c65eef8939a8a45ced3d7c4ed857455ba5ae1148ce7a1c93ff9a3c'
        run: |
          set -euo pipefail
          archive_name="sherpa-onnx-v${SHERPA_ONNX_VERSION}-osx-universal2-shared.tar.bz2"
          url="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/${archive_name}"
          runtime_root=".sherpa-runtime/osx-universal2"

          curl -L --retry 5 --retry-delay 2 --retry-all-errors -o "$archive_name" "$url"
          echo "${SHERPA_ONNX_SHA256}  ${archive_name}" | shasum -a 256 -c -

          rm -rf "$runtime_root"
          mkdir -p "$runtime_root"
          tar -xjf "$archive_name" -C "$runtime_root"
          rm -f "$archive_name"

          extracted_dir="$runtime_root/sherpa-onnx-v${SHERPA_ONNX_VERSION}-osx-universal2-shared"
          test -f "$extracted_dir/lib/libonnxruntime.1.17.1.dylib"
          test -f "$extracted_dir/lib/libsherpa-onnx-c-api.dylib"

          echo "SHERPA_LIB_PATH=${GITHUB_WORKSPACE}/hermeneia/${extracted_dir}" >> "$GITHUB_ENV"

      - name: Stage sherpa runtime libs for macOS bundles (Intel)
        run: |
          set -euo pipefail
          mkdir -p src-tauri/sherpa-libs
          cp -fL "$SHERPA_LIB_PATH/lib/libsherpa-onnx-c-api.dylib" src-tauri/sherpa-libs/
          cp -fL "$SHERPA_LIB_PATH/lib/libsherpa-onnx-cxx-api.dylib" src-tauri/sherpa-libs/
          cp -fL "$SHERPA_LIB_PATH/lib/libonnxruntime.dylib" src-tauri/sherpa-libs/
          cp -fL "$SHERPA_LIB_PATH/lib/libonnxruntime.1.17.1.dylib" src-tauri/sherpa-libs/
          ls -l src-tauri/sherpa-libs

      - run: npm ci

      - name: Build Tauri app (Intel)
        run: |
          RUSTFLAGS="-C link-arg=-Wl,-rpath,@executable_path/../Frameworks" \
          npx tauri build --config src-tauri/tauri.runtime-libs.conf.json --bundles app -- --no-default-features

      - name: Fix macOS dylib linkage (Intel)
        run: |
          set -euo pipefail
          chmod +x scripts/fix-macos-dylibs.sh
          scripts/fix-macos-dylibs.sh src-tauri/target/release/bundle/macos/hermeneia.app

      - name: Verify bundled sherpa dylibs (Intel)
        continue-on-error: true
        run: |
          set -euo pipefail
          app_path="src-tauri/target/release/bundle/macos/hermeneia.app"
          test -d "$app_path"

          ls -la "$app_path/Contents/Frameworks"

          for lib in libsherpa-onnx-c-api.dylib libsherpa-onnx-cxx-api.dylib libonnxruntime.dylib libonnxruntime.1.17.1.dylib; do
            test -f "$app_path/Contents/Frameworks/$lib"
          done

          hermeneia_links="$(otool -L "$app_path/Contents/MacOS/hermeneia")"
          printf '%s\n' "$hermeneia_links"

          codesign --verify --deep --strict --verbose=2 "$app_path"

          if [ -f "$app_path/Contents/MacOS/speaker" ]; then
            speaker_links="$(otool -L "$app_path/Contents/MacOS/speaker")"
            printf '%s\n' "$speaker_links"

            # Accept either bare dylib names or @rpath/@executable_path entries.
            printf '%s\n' "$speaker_links" | grep -Eq "(^|/|@rpath/|@executable_path/../Frameworks/)libsherpa-onnx-c-api\.dylib"

            speaker_rpaths="$(otool -l "$app_path/Contents/MacOS/speaker")"
            printf '%s\n' "$speaker_rpaths" | grep -q "@executable_path/../Frameworks"
          fi

      - name: Build DMG from fixed app (Intel)
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release/bundle/dmg

          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"

          dmg_path="src-tauri/target/release/bundle/dmg/hermeneia_${version}_x64.dmg"
          hdiutil create -volname "hermeneia" -srcfolder src-tauri/target/release/bundle/macos/hermeneia.app -ov -format UDZO "$dmg_path"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: hermeneia/src-tauri/target/release/bundle/dmg/*.dmg
          compression-level: 1

  # ===========================================================================
  # Job 6: macOS ARM + Metal
  # ===========================================================================
  macos-arm-metal:
    runs-on: macos-latest
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.build_metal == true) && (inputs.build_target == 'all' || inputs.build_target == '')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
