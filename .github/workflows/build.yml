      - name: Set up sccache
        if: inputs.use_sccache != false
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Reset sherpa-rs build metadata
        run: |
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-rs-sys
          rm -rf ~/Library/Caches/sherpa-rs

      - name: Download pre-built sherpa-onnx runtime (macOS ARM)
        env:
          SHERPA_ONNX_VERSION: '1.12.9'
          SHERPA_ONNX_SHA256: 'e3f3596b84c65eef8939a8a45ced3d7c4ed857455ba5ae1148ce7a1c93ff9a3c'
        run: |
          set -euo pipefail
          archive_name="sherpa-onnx-v${SHERPA_ONNX_VERSION}-osx-universal2-shared.tar.bz2"
          url="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/${archive_name}"
          runtime_root=".sherpa-runtime/osx-universal2"

          curl -L --retry 5 --retry-delay 2 --retry-all-errors -o "$archive_name" "$url"
          echo "${SHERPA_ONNX_SHA256}  ${archive_name}" | shasum -a 256 -c -

          rm -rf "$runtime_root"
          mkdir -p "$runtime_root"
          tar -xjf "$archive_name" -C "$runtime_root"
          rm -f "$archive_name"

          extracted_dir="$runtime_root/sherpa-onnx-v${SHERPA_ONNX_VERSION}-osx-universal2-shared"
          test -f "$extracted_dir/lib/libonnxruntime.1.17.1.dylib"
          test -f "$extracted_dir/lib/libsherpa-onnx-c-api.dylib"

          echo "SHERPA_LIB_PATH=${GITHUB_WORKSPACE}/hermeneia/${extracted_dir}" >> "$GITHUB_ENV"

      - name: Stage sherpa runtime libs for macOS bundles (ARM)
        run: |
          set -euo pipefail
          mkdir -p src-tauri/sherpa-libs
          cp -fL "$SHERPA_LIB_PATH/lib/libsherpa-onnx-c-api.dylib" src-tauri/sherpa-libs/
          cp -fL "$SHERPA_LIB_PATH/lib/libsherpa-onnx-cxx-api.dylib" src-tauri/sherpa-libs/
          cp -fL "$SHERPA_LIB_PATH/lib/libonnxruntime.dylib" src-tauri/sherpa-libs/
          cp -fL "$SHERPA_LIB_PATH/lib/libonnxruntime.1.17.1.dylib" src-tauri/sherpa-libs/
          ls -l src-tauri/sherpa-libs

      - run: npm ci

      - name: Build Tauri app (Metal)
        run: |
          RUSTFLAGS="-C link-arg=-Wl,-rpath,@executable_path/../Frameworks" \
          npx tauri build --config src-tauri/tauri.runtime-libs.conf.json --features metal --bundles app -- --no-default-features

      - name: Fix macOS dylib linkage (ARM)
        run: |
          set -euo pipefail
          chmod +x scripts/fix-macos-dylibs.sh
          scripts/fix-macos-dylibs.sh src-tauri/target/release/bundle/macos/hermeneia.app

      - name: Verify bundled sherpa dylibs (ARM)
        continue-on-error: true
        run: |
          set -euo pipefail
          app_path="src-tauri/target/release/bundle/macos/hermeneia.app"
          test -d "$app_path"

          ls -la "$app_path/Contents/Frameworks"

          for lib in libsherpa-onnx-c-api.dylib libsherpa-onnx-cxx-api.dylib libonnxruntime.dylib libonnxruntime.1.17.1.dylib; do
            test -f "$app_path/Contents/Frameworks/$lib"
          done

          hermeneia_links="$(otool -L "$app_path/Contents/MacOS/hermeneia")"
          printf '%s\n' "$hermeneia_links"

          codesign --verify --deep --strict --verbose=2 "$app_path"

          if [ -f "$app_path/Contents/MacOS/speaker" ]; then
            speaker_links="$(otool -L "$app_path/Contents/MacOS/speaker")"
            printf '%s\n' "$speaker_links"

            # Accept either bare dylib names or @rpath/@executable_path entries.
            printf '%s\n' "$speaker_links" | grep -Eq "(^|/|@rpath/|@executable_path/../Frameworks/)libsherpa-onnx-c-api\.dylib"

            speaker_rpaths="$(otool -l "$app_path/Contents/MacOS/speaker")"
            printf '%s\n' "$speaker_rpaths" | grep -q "@executable_path/../Frameworks"
          fi

      - name: Build DMG from fixed app (ARM)
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release/bundle/dmg

          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"

          dmg_path="src-tauri/target/release/bundle/dmg/hermeneia_${version}_aarch64.dmg"
          hdiutil create -volname "hermeneia" -srcfolder src-tauri/target/release/bundle/macos/hermeneia.app -ov -format UDZO "$dmg_path"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm-metal
          path: hermeneia/src-tauri/target/release/bundle/dmg/*.dmg
          compression-level: 1

  # ===========================================================================
  # Job 7: Create/update GitHub Release (tag pushes only)
  # CUDA artifacts are already attached directly by their jobs.
  # This job handles CPU + Metal artifacts.
  # ===========================================================================
  release:
    runs-on: ubuntu-22.04
    needs: [linux-cpu, linux-cuda, windows-cpu, windows-cuda, macos-intel, macos-arm-metal]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true)
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect and rename release assets
        run: |
          mkdir -p release-assets

          # Linux CPU
          if [ -d artifacts/linux-cpu ]; then
            for f in artifacts/linux-cpu/deb/*.deb; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .deb)
              cp "$f" "release-assets/${base}-cpu.deb"
            done
            for f in artifacts/linux-cpu/rpm/*.rpm; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .rpm)
              cp "$f" "release-assets/${base}-cpu.rpm"
            done
            for f in artifacts/linux-cpu/appimage/*.AppImage; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .AppImage)
              cp "$f" "release-assets/${base}-cpu.AppImage"
            done
          fi

          # Windows CPU
          if [ -d artifacts/windows-cpu ]; then
            for f in artifacts/windows-cpu/*.exe; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .exe)
              cp "$f" "release-assets/${base}-cpu.exe"
            done
          fi

          # macOS Intel
          if [ -d artifacts/macos-intel ]; then
            cp artifacts/macos-intel/*.dmg release-assets/ 2>/dev/null || true
          fi

          # macOS ARM Metal
          if [ -d artifacts/macos-arm-metal ]; then
            cp artifacts/macos-arm-metal/*.dmg release-assets/ 2>/dev/null || true
          fi

          echo "Release assets:"
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: ${{ inputs.release_visibility == 'draft' }}
          prerelease: ${{ inputs.release_visibility != 'draft' }}
          generate_release_notes: true
          body_path: .github/RELEASE_NOTES_HEADER.md
          fail_on_unmatched_files: true
          files: release-assets/*

      - name: Verify release includes download guide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          body=$(gh release view "$RELEASE_TAG" --json body --jq '.body')
          if [[ "$body" != *"## Download"* ]]; then
            echo "Release body is missing the download guide heading (## Download)."
            exit 1
          fi
