name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_target:
        description: 'What to build'
        type: choice
        default: 'all'
        options:
          - all
          - cuda-both
          - cuda-linux
          - cuda-windows
      use_sccache:
        description: 'Use sccache to speed up Rust compilation'
        type: boolean
        default: true
      build_metal:
        description: 'Build Metal variant'
        type: boolean
        default: true
      create_release:
        description: 'Create a draft GitHub Release (requires build_target=all)'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (e.g. v0.1.0)'
        type: string
        default: 'v0.0.0-test'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'

defaults:
  run:
    working-directory: hermeneia

jobs:
  # ===========================================================================
  # Job 1: Linux CPU
  # ===========================================================================
  linux-cpu:
    runs-on: ubuntu-22.04
    if: inputs.build_target == 'all' || inputs.build_target == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermeneia/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermeneia/src-tauri

      - name: Set up sccache
        if: inputs.use_sccache != false
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf

      - run: npm ci

      - name: Build Tauri (CPU)
        run: npx tauri build --bundles deb,rpm,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-cpu
          path: |
            hermeneia/src-tauri/target/release/bundle/deb/*.deb
            hermeneia/src-tauri/target/release/bundle/rpm/*.rpm
            hermeneia/src-tauri/target/release/bundle/appimage/*.AppImage
          compression-level: 1

  # ===========================================================================
  # Job 2: Linux CUDA (Docker-based)
  # ===========================================================================
  linux-cuda:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build_target == 'all' || inputs.build_target == 'cuda-both' || inputs.build_target == 'cuda-linux'
    steps:
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/Java* \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/node \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/google-cloud-sdk \
            /usr/lib/jvm \
            /usr/lib/mono \
            /usr/lib/heroku
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-cuda-${{ hashFiles('hermeneia/src-tauri/Dockerfile.cuda-static') }}
          restore-keys: docker-cuda-

      - name: Cache Cargo registry (for Docker)
        uses: actions/cache@v4
        with:
          path: ~/.cargo-docker-cache
          key: cargo-docker-${{ hashFiles('hermeneia/src-tauri/Cargo.lock') }}
          restore-keys: cargo-docker-

      - name: Build Docker image
        working-directory: hermeneia/src-tauri
        run: |
          docker buildx build \
            --file Dockerfile.cuda-static \
            --target bundler \
            --tag hermeneia-cuda-bundler:12.8 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load .
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Build CUDA bundles in Docker
        run: |
          mkdir -p ~/.cargo-docker-cache/registry ~/.cargo-docker-cache/git
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -v "$HOME/.cargo-docker-cache/registry:/root/.cargo/registry" \
            -v "$HOME/.cargo-docker-cache/git:/root/.cargo/git" \
            -w /project/hermeneia \
            -e NO_STRIP=true \
            -e APPIMAGE_EXTRACT_AND_RUN=1 \
            -e "RUSTFLAGS=-C link-args=-Wl,-rpath,\$ORIGIN/../lib/hermeneia:\$ORIGIN/../lib" \
            hermeneia-cuda-bundler:12.8 \
            sh -c '
              ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/lib/x86_64-linux-gnu/libcuda.so.1 &&
              mkdir -p src-tauri/cuda-libs &&
              cp /build/lib/libcudart.so.12 src-tauri/cuda-libs/ &&
              cp /build/lib/libcublas.so.12 src-tauri/cuda-libs/ &&
              cp /build/lib/libcublasLt.so.12 src-tauri/cuda-libs/ &&
              cp /build/lib/libnvrtc.so.12 src-tauri/cuda-libs/ &&
              cp /build/lib/libcurand.so.10 src-tauri/cuda-libs/ &&
              cp -L /build/lib/libcudnn*.so.9* src-tauri/cuda-libs/ &&
              cp -L ${SHERPA_LIB_PATH}/lib/libonnxruntime_providers_shared.so src-tauri/cuda-libs/ &&
              cp -L ${SHERPA_LIB_PATH}/lib/libonnxruntime_providers_cuda.so src-tauri/cuda-libs/ &&
              npm ci &&
              export LD_LIBRARY_PATH=$(pwd)/src-tauri/cuda-libs:$(pwd)/src-tauri/target/release:$LD_LIBRARY_PATH &&
              npx tauri build --config src-tauri/tauri.cuda.conf.json --bundles deb,rpm,appimage -- --no-default-features --features cuda &&
              sh /project/hermeneia/scripts/fix-appimage-cuda.sh /project/hermeneia/src-tauri/target/release/bundle/appimage
            '

      - name: Rename CUDA artifacts
        run: |
          sudo chown -R $(id -u):$(id -g) src-tauri/target/release/bundle
          cd src-tauri/target/release/bundle
          # Rename deb
          for f in deb/*.deb; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .deb)
            mv "$f" "deb/${base}-cuda.deb"
          done
          # Rename rpm
          for f in rpm/*.rpm; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .rpm)
            mv "$f" "rpm/${base}-cuda.rpm"
          done
          # Rename appimage
          for f in appimage/*.AppImage; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .AppImage)
            mv "$f" "appimage/${base}-cuda.AppImage"
          done

      # Attach directly to Release (bypasses 500MB artifact limit)
      - name: Attach CUDA artifacts to Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          files: |
            hermeneia/src-tauri/target/release/bundle/deb/*-cuda.deb
            hermeneia/src-tauri/target/release/bundle/rpm/*-cuda.rpm
            hermeneia/src-tauri/target/release/bundle/appimage/*-cuda.AppImage

      # No release: upload as artifact for inspection
      - name: Upload CUDA artifacts
        if: "!startsWith(github.ref, 'refs/tags/v') && inputs.create_release != true"
        uses: actions/upload-artifact@v4
        with:
          name: linux-cuda
          path: |
            hermeneia/src-tauri/target/release/bundle/deb/*-cuda.deb
            hermeneia/src-tauri/target/release/bundle/rpm/*-cuda.rpm
            hermeneia/src-tauri/target/release/bundle/appimage/*-cuda.AppImage
          compression-level: 1

  # ===========================================================================
  # Job 3: Windows CPU
  # ===========================================================================
  windows-cpu:
    runs-on: windows-latest
    if: inputs.build_target == 'all' || inputs.build_target == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermeneia/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermeneia/src-tauri

      - name: Set up sccache
        if: inputs.use_sccache != false
        uses: mozilla-actions/sccache-action@v0.0.7

      - run: npm ci

      - name: Build Tauri (CPU)
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cpu
          path: hermeneia/src-tauri/target/release/bundle/nsis/*.exe
          compression-level: 1

  # ===========================================================================
  # Job 4: Windows CUDA
  # ===========================================================================
  windows-cuda:
    runs-on: windows-latest
    timeout-minutes: 120
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build_target == 'all' || inputs.build_target == 'cuda-both' || inputs.build_target == 'cuda-windows'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermeneia/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermeneia/src-tauri

      - name: Set up sccache
        if: inputs.use_sccache != false
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '12.8.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "nvrtc", "nvrtc_dev", "curand", "curand_dev", "visual_studio_integration"]'

      - name: Download pre-built sherpa-onnx with CUDA 12.x + cuDNN 9.x
        shell: pwsh
        env:
          SHERPA_ONNX_VERSION: '1.12.28'
          SHERPA_ONNX_SHA256: 'db77faa78e6e326239354563c21eb84a57f22f0f72ebb3be5d61086232afcb8b'
        run: |
          $archiveName = "sherpa-onnx-v$env:SHERPA_ONNX_VERSION-cuda-12.x-cudnn-9.x-win-x64-cuda.tar.bz2"
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$env:SHERPA_ONNX_VERSION/$archiveName"
          Write-Host "Downloading $url ..."
          Invoke-WebRequest -Uri $url -OutFile $archiveName
          $actualSha256 = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSha256 = $env:SHERPA_ONNX_SHA256.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "SHA256 mismatch for $archiveName. Expected $expectedSha256 but got $actualSha256"
          }
          Write-Host "SHA256 verified: $actualSha256"
          Write-Host "Extracting..."
          tar -xjf $archiveName
          Remove-Item $archiveName
          $extractedDir = "sherpa-onnx-v$env:SHERPA_ONNX_VERSION-cuda-12.x-cudnn-9.x-win-x64-cuda"
          Write-Host "Sherpa libs at: $extractedDir"
          Get-ChildItem "$extractedDir/lib/" | Select-Object Name, Length
          # Set SHERPA_LIB_PATH so sherpa-rs-sys uses pre-built libs (skips cmake)
          echo "SHERPA_LIB_PATH=${{ github.workspace }}/hermeneia/$extractedDir" >> $env:GITHUB_ENV

      - name: Copy CUDA + ORT + cuDNN DLLs for bundling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/cuda-libs
          if (-not $env:SHERPA_LIB_PATH) {
            throw "SHERPA_LIB_PATH is not set"
          }
          $sherpaLibDir = Join-Path $env:SHERPA_LIB_PATH "lib"
          if (-not (Test-Path $sherpaLibDir)) {
            throw "Sherpa lib directory does not exist: $sherpaLibDir"
          }
          # CUDA runtime DLLs from toolkit
          Copy-Item "$env:CUDA_PATH\bin\cudart64_*.dll" "src-tauri\cuda-libs\"
          Copy-Item "$env:CUDA_PATH\bin\cublas64_*.dll" "src-tauri\cuda-libs\"
          Copy-Item "$env:CUDA_PATH\bin\cublasLt64_*.dll" "src-tauri\cuda-libs\"
          Copy-Item "$env:CUDA_PATH\bin\nvrtc64_*.dll" "src-tauri\cuda-libs\"
          Copy-Item "$env:CUDA_PATH\bin\curand64_*.dll" "src-tauri\cuda-libs\"
          # ORT provider DLLs (dlopen'd at runtime, not link-time deps)
          $requiredOrtDlls = @(
            "onnxruntime_providers_shared.dll",
            "onnxruntime_providers_cuda.dll"
          )
          foreach ($dll in $requiredOrtDlls) {
            $source = Join-Path $sherpaLibDir $dll
            if (-not (Test-Path $source)) {
              throw "Missing required ORT provider DLL: $source"
            }
            Copy-Item $source "src-tauri\cuda-libs\"
          }
          # cuDNN DLLs (dlopen'd by ORT CUDA provider)
          $cudnnDlls = @(Get-ChildItem (Join-Path $sherpaLibDir "cudnn*.dll") -File)
          if ($cudnnDlls.Count -eq 0) {
            throw "No cuDNN DLLs found in $sherpaLibDir"
          }
          $cudnnDlls | Copy-Item -Destination "src-tauri\cuda-libs\"
          Write-Host "Bundled DLLs:"
          Get-ChildItem src-tauri/cuda-libs/

      - uses: ilammy/msvc-dev-cmd@v1

      - run: npm ci

      - name: Build Tauri (CUDA)
        env:
          CUDA_COMPUTE_CAP: '75'
        run: npx tauri build --config src-tauri/tauri.cuda.windows.conf.json --bundles nsis -- --no-default-features --features cuda

      - name: Rename CUDA artifact
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $newName = $_.BaseName + '-cuda' + $_.Extension
            Rename-Item $_.FullName -NewName $newName
          }

      - name: Attach CUDA artifacts to Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          files: hermeneia/src-tauri/target/release/bundle/nsis/*-cuda.exe

      - name: Upload CUDA artifacts
        if: "!startsWith(github.ref, 'refs/tags/v') && inputs.create_release != true"
        uses: actions/upload-artifact@v4
        with:
          name: windows-cuda
          path: hermeneia/src-tauri/target/release/bundle/nsis/*-cuda.exe
          compression-level: 1

  # ===========================================================================
  # Job 5: macOS Intel
  # ===========================================================================
  macos-intel:
    runs-on: macos-15-intel
    if: inputs.build_target == 'all' || inputs.build_target == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermeneia/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermeneia/src-tauri

      - name: Set up sccache
        if: inputs.use_sccache != false
        uses: mozilla-actions/sccache-action@v0.0.7

      - run: npm ci

      - name: Build Tauri (Intel)
        run: npx tauri build --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: hermeneia/src-tauri/target/release/bundle/dmg/*.dmg
          compression-level: 1

  # ===========================================================================
  # Job 6: macOS ARM + Metal
  # ===========================================================================
  macos-arm-metal:
    runs-on: macos-latest
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.build_metal == true) && (inputs.build_target == 'all' || inputs.build_target == '')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermeneia/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermeneia/src-tauri

      - name: Set up sccache
        if: inputs.use_sccache != false
        uses: mozilla-actions/sccache-action@v0.0.7

      - run: npm ci

      - name: Build Tauri (Metal)
        run: npx tauri build --features metal --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm-metal
          path: hermeneia/src-tauri/target/release/bundle/dmg/*.dmg
          compression-level: 1

  # ===========================================================================
  # Job 7: Create/update draft GitHub Release (tag pushes only)
  # CUDA artifacts are already attached directly by their jobs.
  # This job handles CPU + Metal artifacts.
  # ===========================================================================
  release:
    runs-on: ubuntu-22.04
    needs: [linux-cpu, linux-cuda, windows-cpu, windows-cuda, macos-intel, macos-arm-metal]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true)
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect and rename release assets
        run: |
          mkdir -p release-assets

          # Linux CPU
          if [ -d artifacts/linux-cpu ]; then
            for f in artifacts/linux-cpu/deb/*.deb; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .deb)
              cp "$f" "release-assets/${base}-cpu.deb"
            done
            for f in artifacts/linux-cpu/rpm/*.rpm; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .rpm)
              cp "$f" "release-assets/${base}-cpu.rpm"
            done
            for f in artifacts/linux-cpu/appimage/*.AppImage; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .AppImage)
              cp "$f" "release-assets/${base}-cpu.AppImage"
            done
          fi

          # Windows CPU
          if [ -d artifacts/windows-cpu ]; then
            for f in artifacts/windows-cpu/*.exe; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .exe)
              cp "$f" "release-assets/${base}-cpu.exe"
            done
          fi

          # macOS Intel
          if [ -d artifacts/macos-intel ]; then
            cp artifacts/macos-intel/*.dmg release-assets/ 2>/dev/null || true
          fi

          # macOS ARM Metal
          if [ -d artifacts/macos-arm-metal ]; then
            cp artifacts/macos-arm-metal/*.dmg release-assets/ 2>/dev/null || true
          fi

          echo "Release assets:"
          ls -lh release-assets/

      - name: Create draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          body_path: .github/RELEASE_NOTES_HEADER.md
          files: release-assets/*
